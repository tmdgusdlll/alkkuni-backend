spring:
  application:
    name: alkkuni-api
  profiles:
    default: local
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        # api 연결에만 PostgreSQL JIT를 끈다(2026-11-17). 검색 쿼리 cost(약 16만)가 jit_above_cost(10만)를 넘어
        # 실행마다 LLVM 컴파일이 붙었고, 운영 t4g에서 컴파일만 약 115ms였다. api는 짧은 조회뿐이라 JIT로 얻는 게 없다.
        # DB 서버 설정이 아니라 접속 옵션이라 DB 재시작이 없고, 큰 쿼리를 도는 batch는 기본값(JIT 켬) 그대로다.
        options: "-c jit=off"
  jpa:
    hibernate:
      # 스키마는 Flyway가 만든다. 엔티티와 테이블이 어긋나면 기동 시 실패시킨다.
      ddl-auto: validate
