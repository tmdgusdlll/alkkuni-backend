spring:
  application:
    name: alkkuni-batch
  profiles:
    default: local
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 스키마는 Flyway가 만든다. 엔티티와 테이블이 어긋나면 기동 시 실패시킨다.
      ddl-auto: validate
  http:
    clients:
      # 스파이크에서 100건 응답이 0.3~0.4초. 1000건과 서버 지연을 감안해 넉넉히 둔다.
      read-timeout: 120s

# 식품안전나라 OpenAPI. 로컬은 루트 .env, 운영은 Parameter Store에서 환경변수로 주입한다.
foodsafety:
  api-key: ${FOODSAFETY_API_KEY}
