# 운영(EC2 한 대): nginx + api + db, batch는 필요할 때 한 번 실행.
# 값은 EC2의 .env에서 읽는다: DB_NAME, DB_USERNAME, DB_PASSWORD, FOODSAFETY_API_KEY, IMAGE_REGISTRY, RAW_STORE_BUCKET, API_TAG, BATCH_TAG
# .env는 deploy/deploy.sh가 배포 때마다 Parameter Store(/alkkuni/prod)에서 다시 만들고, 태그는 배포한 커밋 sha로 둔다.
#
# 배포:     deploy/deploy.sh <sha> (ci-cd.yml이 SSM으로 부른다). pull 후 up -d --no-deps --wait api, down은 쓰지 않는다
# 배치:     deploy/run-job.sh initial-load
#           api가 healthy(Flyway 끝)인 뒤에만 돌린다(batch는 validate만 한다). depends_on으로 걸면 run이 api를 다시 만들거나
#           api가 unhealthy일 때 배치가 안 돌아서, 순서는 run-job.sh가 헬스를 확인해 지킨다.
#
# web(Next.js)은 이 파일에 없다. 프론트 레포의 compose 파일이 프로젝트 alkkuni-web으로 따로 띄우고(태그·배포·롤백 분리),
# 이 프로젝트의 기본 네트워크 alkkuni_default에 external로 들어와 nginx가 web:3000으로 찾는다.
# 프론트와의 약속: 네트워크 alkkuni_default, 서비스 이름 web, 포트 3000. 바꾸면 프론트 레포도 함께 고친다.
# 네트워크 이름은 바꾸지 않는다(2026-11-18 로컬 확인). deploy.sh가 up db nginx → up api로 나눠 올려 이름이 바뀌는 배포는
# 옛 네트워크 삭제에서 실패하고, 롤백(.prev의 옛 파일)이 이름을 다시 바꿔 컨테이너가 멈추거나 두 네트워크로 갈라진다.
# 백엔드만 down하면 web이 붙어 있어 네트워크 삭제가 실패한다. web부터 내린다.
#
# mem_limit(api·batch 640m, db 512m, nginx 64m)은 운영 첫 적재(46,401건, 2026-11-16)에서 잰 피크로 확인했다.
# batch 381MiB, api 356MiB, db 254MiB, 남은 메모리 최소 337MiB, swap 4MiB, OOM 0회. 모두 한도 안이라 그대로 둔다.
# 적재 중 검색 타임아웃 2회는 메모리가 아니라 CPU 경합(batch+db가 vCPU 2개 포화)이었다. 증분·회수는 새벽에 돌린다.
# 한도 합계(2GB 중): 이 파일 1,856m(api 640 + batch 640 + db 512 + nginx 64) + web(프론트 레포 compose, 아직 미정).
# 한도는 상한이라 합이 2GB를 넘을 수 있지만, 실제 피크 합(위 실측 + web)이 넘지 않아야 한다. web을 붙이면 batch 실행 중 docker stats로 다시 잰다.

# 프로젝트 이름을 고정한다. DB 볼륨(alkkuni_db-data)과 web이 들어오는 네트워크(alkkuni_default) 이름이 프로젝트 이름에서
# 나와서, 디렉터리 이름이 바뀌면 빈 새 볼륨으로 뜨고 web과 끊긴다. 지금 기본값(디렉터리 이름 alkkuni)과 같아 바뀌는 것은 없다.
name: alkkuni

# 로그 회전. 기본 json-file은 끝없이 쌓여 EBS가 차면 DB 쓰기·배포가 멈춘다.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging

  api:
    image: ${IMAGE_REGISTRY:-alkkuni}/alkkuni-api:${API_TAG:-latest}
    environment: &app-env
      # 공통 yaml의 기본 프로필이 local이라 빠지면 localhost DB로 접속한다.
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:?}
      # :? 는 값이 없으면 compose 단계에서 실패한다(빈 값으로 기동하지 않게).
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    # Spring graceful shutdown(30초) 동안 처리 중인 요청을 마치게 한다. 기본 10초면 먼저 SIGKILL이 간다.
    stop_grace_period: 30s
    mem_limit: 640m
    logging: *logging

  # up -d로는 뜨지 않는다(profiles). run --rm --no-deps로 작업 하나를 돌리고 끝난다(위 "배치" 참고).
  batch:
    image: ${IMAGE_REGISTRY:-alkkuni}/alkkuni-batch:${BATCH_TAG:-latest}
    profiles: [job]
    environment:
      <<: *app-env
      FOODSAFETY_API_KEY: ${FOODSAFETY_API_KEY:?}
      # 원본은 S3에 바로 올린다(S3RawStore). 자격 증명은 EC2 인스턴스 역할(alkkuni-ec2)이다.
      RAW_STORE_TYPE: s3
      RAW_STORE_BUCKET: ${RAW_STORE_BUCKET:?}
    stop_grace_period: 30s
    mem_limit: 640m
    logging: *logging

  db:
    # 로컬 compose.yaml·Testcontainers와 같은 이미지(glibc). alpine(musl)은 문자열 정렬이 달라 테스트와 운영 순서가 갈린다.
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

volumes:
  db-data:
