# 운영(EC2 한 대): nginx + api + db, batch는 필요할 때 한 번 실행.
# 값은 EC2의 .env에서 읽는다: DB_NAME, DB_USERNAME, DB_PASSWORD, FOODSAFETY_API_KEY, IMAGE_REGISTRY, RAW_STORE_BUCKET, API_TAG, BATCH_TAG
# .env는 deploy/deploy.sh가 배포 때마다 Parameter Store(/alkkuni/prod)에서 다시 만들고, 태그는 배포한 커밋 sha로 둔다.
#
# 배포:     deploy/deploy.sh <sha> (ci-cd.yml이 SSM으로 부른다). pull 후 up -d --no-deps --wait api, down은 쓰지 않는다
# 배치:     deploy/run-job.sh initial-load
#           api가 healthy(Flyway 끝)인 뒤에만 돌린다(batch는 validate만 한다). depends_on으로 걸면 run이 api를 다시 만들거나
#           api가 unhealthy일 때 배치가 안 돌아서, 순서는 run-job.sh가 헬스를 확인해 지킨다.
#
# mem_limit(api·batch 640m, db 512m, nginx 64m)은 운영 첫 적재(46,401건, 2026-11-16)에서 잰 피크로 확인했다.
# batch 381MiB, api 356MiB, db 254MiB, 남은 메모리 최소 337MiB, swap 4MiB, OOM 0회. 모두 한도 안이라 그대로 둔다.
# 적재 중 검색 타임아웃 2회는 메모리가 아니라 CPU 경합(batch+db가 vCPU 2개 포화)이었다. 증분·회수는 새벽에 돌린다.
# 로그 회전. 기본 json-file은 끝없이 쌓여 EBS가 차면 DB 쓰기·배포가 멈춘다.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging

  api:
    image: ${IMAGE_REGISTRY:-alkkuni}/alkkuni-api:${API_TAG:-latest}
    environment: &app-env
      # 공통 yaml의 기본 프로필이 local이라 빠지면 localhost DB로 접속한다.
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:?}
      # :? 는 값이 없으면 compose 단계에서 실패한다(빈 값으로 기동하지 않게).
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    restart: unless-stopped
    # Spring graceful shutdown(30초) 동안 처리 중인 요청을 마치게 한다. 기본 10초면 먼저 SIGKILL이 간다.
    stop_grace_period: 30s
    mem_limit: 640m
    logging: *logging

  # up -d로는 뜨지 않는다(profiles). run --rm --no-deps로 작업 하나를 돌리고 끝난다(위 "배치" 참고).
  batch:
    image: ${IMAGE_REGISTRY:-alkkuni}/alkkuni-batch:${BATCH_TAG:-latest}
    profiles: [job]
    environment:
      <<: *app-env
      FOODSAFETY_API_KEY: ${FOODSAFETY_API_KEY:?}
      # 원본은 S3에 바로 올린다(S3RawStore). 자격 증명은 EC2 인스턴스 역할(alkkuni-ec2)이다.
      RAW_STORE_TYPE: s3
      RAW_STORE_BUCKET: ${RAW_STORE_BUCKET:?}
    stop_grace_period: 30s
    mem_limit: 640m
    logging: *logging

  db:
    # 로컬 compose.yaml·Testcontainers와 같은 이미지(glibc). alpine(musl)은 문자열 정렬이 달라 테스트와 운영 순서가 갈린다.
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:?}
      POSTGRES_USER: ${DB_USERNAME:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging

volumes:
  db-data:
