# 라우팅(PLANNING.md "배포"). /api/*·/actuator/health는 api, 나머지는 web(Next.js).
# web은 프론트 레포 compose(프로젝트 alkkuni-web)가 같은 네트워크(alkkuni_default)에 띄운다.
# CloudFront 뒤에서 도는 설정이다(PLANNING.md "보안 운영"). /admin IP 제한은 /admin이 생길 때 넣는다.

# 실제 사용자 IP 복원. 직접 접속은 보안 그룹(CloudFront prefix list만 80 허용)이 막으므로 연결 IP를 따지지 않는다.
# ponytail: 보안 그룹이 잘못 열리면 헤더를 꾸며 호출 제한을 피할 수 있다. 그게 걱정되면 CloudFront origin-facing 대역만 나열한다.
# recursive를 끈 채(기본값)라 X-Forwarded-For 맨 끝, 즉 CloudFront가 붙인 값만 쓴다. 클라이언트가 앞에 꾸민 값은 무시된다.
set_real_ip_from 0.0.0.0/0;
real_ip_header X-Forwarded-For;

# 호출 제한 1겹(실제 IP 단위). 처음 값이라 넉넉하게 두고 공개 뒤 로그를 보고 조인다.
# Next 링크 미리 불러오기는 화면에 보이는 링크마다 요청이 나가(검색 결과 20~30개) 일반 통과 나눠 넉넉하게 센다.
# 요청 하나는 두 통 중 하나에만 들어간다(키가 빈 값이면 Nginx가 세지 않는다). 헤더를 꾸며도 미리 불러오기 통으로 옮겨 갈 뿐 제한은 남는다.
# ponytail: IP 단위라 통신사 NAT 뒤 여러 명이 한 통을 쓰고, IPv6는 주소를 바꿔 가며 피할 수 있다. 공개 뒤 로그로 한도를 조인다.
map "$http_next_router_prefetch$http_next_router_segment_prefetch" $page_key {
    ""      $binary_remote_addr;
    default "";
}
map "$http_next_router_prefetch$http_next_router_segment_prefetch" $prefetch_key {
    ""      "";
    default $binary_remote_addr;
}
limit_req_zone $page_key zone=per_ip:10m rate=10r/s;
limit_req_zone $prefetch_key zone=prefetch:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;

    # 컨테이너가 다시 뜨면 IP가 바뀐다. Docker 내장 DNS로 요청 때마다 이름을 풀어 Nginx 재시작 없이 따라간다.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8080;
    set $web http://web:3000;

    # X-Forwarded-For는 위에서 골라낸 실제 IP 하나만 넘긴다. 받은 헤더를 이어 붙이면 맨 앞에 클라이언트가 꾸민 값이 남아 뒤에서 잘못 믿을 수 있다.
    # X-Forwarded-Proto는 CloudFront~Nginx가 HTTP라 $scheme이 http다. 쓰는 곳이 생기는 인증 PR에서 Host·forward-headers-strategy와 함께 맞춘다.
    location /api/ {
        limit_req zone=per_ip burst=20 nodelay;
        limit_req zone=prefetch burst=100 nodelay;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CloudFront 기본 동작으로 외부에 열리므로 같은 제한을 건다. 배포 확인 curl(최대 6번)은 걸리지 않는다.
    location = /actuator/health {
        limit_req zone=per_ip burst=20 nodelay;
        limit_req zone=prefetch burst=100 nodelay;
        proxy_pass $api;
    }

    # 해시가 붙은 정적 파일. CloudFront가 캐시하고 화면 하나에 수십 개라 호출 제한에서 뺀다.
    location ^~ /_next/static/ {
        proxy_pass $web;
        proxy_set_header Host $host;
    }

    # 페이지 요청도 센다. 서버 컴포넌트는 api:8080을 직접 불러 Nginx를 안 거치므로, 페이지가 백엔드 부하로 들어가는 유일한 관문이다.
    location / {
        limit_req zone=per_ip burst=20 nodelay;
        limit_req zone=prefetch burst=100 nodelay;
        proxy_pass $web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
