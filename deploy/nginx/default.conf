# 기본 배포용 라우팅(PLANNING.md "배포"). /api/*·/actuator/health는 api, 나머지는 web(Next.js).
# web이 아직 없어 / 는 502가 난다. 실제 IP 복원·limit_req·/admin IP 제한은 CloudFront를 붙일 때 넣는다.
server {
    listen 80;

    # 컨테이너가 다시 뜨면 IP가 바뀐다. Docker 내장 DNS로 요청 때마다 이름을 풀어 Nginx 재시작 없이 따라간다.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8080;
    set $web http://web:3000;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/health {
        proxy_pass $api;
    }

    location / {
        proxy_pass $web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
